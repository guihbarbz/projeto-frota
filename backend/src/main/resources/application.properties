spring.application.name=frota
server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/frota}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

frota.semaforo.margem-km-percentual=10
frota.semaforo.margem-dias=15

frota.jwt.secret=${JWT_SECRET}
frota.jwt.expiracao-horas=8
frota.jwt.expiracao-servico-dias=90
frota.admin.email=${ADMIN_EMAIL:admin@colibri.local}
frota.admin.senha=${ADMIN_SENHA:}

frota.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB